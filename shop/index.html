      .shimmer-text {

        color: transparent;
        -webkit-background-clip: text;
        background-clip: text;
        animation: shimmer 4s linear infinite;
      }
      
      @keyframes shimmer {
        0% {
          background-position: 0% 50%;

        50% {

      .reviews-section {

      .reviews-title {

      .reviews-container {

      .reviews-track {
        display: flex;

      .reviews-track:hover {

      .review-header {

  <body>
    <div id="root"></div>
    
    <!-- Reviews Section -->
    <section class="reviews-section">
      <h2 class="reviews-title">What Our Customers Say</h2>
      <div class="reviews-container">
        <div id="reviews-track" class="reviews-track">
          <div class="loading-reviews">Loading reviews...</div>
        </div>
      </div>
    </section>

    <!-- Example usage of shimmer-text class -->
    <!-- <h1><span class="shimmer-text">E Product Hub BD</span> - Premium Digital Services</h1> -->
    
    <script>
      // Fetch reviews from Google Sheet
      async function fetchReviews() {
        const SPREADSHEET_ID = '13tyJIt_SqMQGZq4b9VaDG20AIEOFeBCWdOJu9yifKYM';
        
        try {
          // Make the Google Sheet public and use CSV export
          const csvUrl = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/export?format=csv&gid=0`;
          const response = await fetch(csvUrl);
          
          if (!response.ok) {
            throw new Error('Failed to fetch reviews');
          }
          
          const csvText = await response.text();
          const reviews = parseCSV(csvText);
          displayReviews(reviews);
          
        } catch (error) {
          console.error('Error fetching reviews:', error);
          displayError();
        }
      }

      // Parse CSV data
      function parseCSV(csvText) {
        const lines = csvText.split('\n').filter(line => line.trim());
        const headers = lines[0].split(',').map(h => h.trim());
        const reviews = [];
        
        for (let i = 1; i < lines.length; i++) {
          const values = lines[i].split(',').map(v => v.trim().replace(/^"|"$/g, ''));
          if (values.length >= 3) {
            reviews.push({
              name: values[0] || 'Anonymous',
              comment: values[1] || 'Great service!',
              image: values[2] || `https://picsum.photos/seed/user${i}/60/60.jpg`
            });
          }
        }
        
        return reviews;
      }

      // Display reviews in the track
      function displayReviews(reviews) {
        const track = document.getElementById('reviews-track');
        
        if (reviews.length === 0) {
          track.innerHTML = '<div class="error-reviews">No reviews available</div>';
          return;
        }
        
        // Create two sets of reviews for seamless scrolling
        const allReviews = [...reviews, ...reviews];
        
        track.innerHTML = allReviews.map(review => `
          <div class="review-card">
            <div class="review-header">
              <img src="${review.image}" alt="${review.name}" class="review-avatar" onerror="this.src='https://picsum.photos/seed/default/60/60.jpg'">
              <div>
                <h3 class="review-name">${review.name}</h3>
                <div class="review-rating">★★★★★</div>
              </div>
            </div>
            <p class="review-comment">"${review.comment}"</p>
          </div>
        `).join('');
      }

      // Display error message
      function displayError() {
        const track = document.getElementById('reviews-track');
        track.innerHTML = '<div class="error-reviews">Unable to load reviews. Please check back later.</div>';
      }

      // Move reviews section before footer
      function moveReviewsBeforeFooter() {
        const reviewsSection = document.querySelector('.reviews-section');
        const footer = document.querySelector('footer');
        
        if (reviewsSection && footer && reviewsSection.parentNode === document.body) {
          document.body.insertBefore(reviewsSection, footer);
        }
      }

      // Initialize reviews when page loads
      document.addEventListener('DOMContentLoaded', () => {
        fetchReviews();
        
        // Move reviews section before footer
        setTimeout(moveReviewsBeforeFooter, 100);
      });
    </script>
