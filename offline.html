<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>E Product Hub BD · Offline</title>
    <meta name="color-scheme" content="light dark" />
    <style>
      :root {
        color-scheme: light dark;
        --background: #fafafa;
        --card: #ffffff;
        --text-primary: #222222;
        --text-secondary: #555555;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --background: #050505;
          --card: #101010;
          --text-primary: #f6f6f6;
          --text-secondary: #d0d0d0;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: 'Afacad', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, rgba(123, 42, 237, 0.12), transparent 55%),
          var(--background);
        color: var(--text-primary);
      }

      main {
        width: min(90vw, 420px);
        background: var(--card);
        border-radius: 20px;
        padding: 2.5rem 2rem;
        text-align: center;
        box-shadow: 0 28px 60px rgba(0, 0, 0, 0.18);
        border: 1px solid rgba(125, 125, 125, 0.2);
        backdrop-filter: blur(18px);
      }

      h1 {
        font-size: clamp(1.8rem, 3vw + 1rem, 2.4rem);
        margin-bottom: 0.75rem;
      }

      p {
        margin: 0 auto 1.75rem;
        font-size: 1rem;
        line-height: 1.6;
        color: var(--text-secondary);
        max-width: 32ch;
      }

      button {
        border: none;
        border-radius: 999px;
        font-size: 1rem;
        padding: 0.8rem 1.9rem;
        cursor: pointer;
        color: #ffffff;
        background: #2d2d2d;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      button:hover {
        transform: translateY(-1px);
        background: #464646;
      }
    </style>

    <!-- Vercel Web Analytics -->
    <script>
      window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
  </head>
  <body>
    <main>
      <h1>You’re Offline</h1>
      <p>
        We can’t reach E Product Hub BD right now. Please check your internet connection and try again.
      </p>
      <button type="button" onclick="window.location.reload()">Try Again</button>
    </main>
  </body>
</html>
